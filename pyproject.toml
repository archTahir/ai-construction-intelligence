[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "construction-intelligence"
version = "0.1.0"
description = "Evidence-linked construction technical and project-management intelligence"
requires-python = ">=3.11"
dependencies = [
  "google-genai>=1.56.0,<2",
  "pydantic>=2.10.0,<3",
  "PyMuPDF>=1.24.0,<2"
]

[project.scripts]
construction-intelligence = "construction_intelligence.cli:main"

[tool.setuptools.packages.find]
include = ["construction_intelligence*"]

